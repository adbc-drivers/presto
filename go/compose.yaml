name: presto
services:
  # Work around https://github.com/docker/compose/issues/10596
  test-service:
    image: alpine:latest
    command: ["sleep", "infinity"]
    depends_on:
      presto:
        condition: service_healthy
      presto-init:
        condition: service_completed_successfully

  presto:
    image: prestodb/presto:latest
    healthcheck:
      # /v1/info reports "starting":true until the server is ready to accept
      # queries.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - 8080:8080
    volumes:
      # Replace the image's default catalog directory (jmx, tpcds, etc.) with
      # just the catalogs used by the test suites; enumerating the built-in
      # catalogs makes unfiltered GetObjects crawls very slow.
      - "./ci/docker/catalog:/opt/presto-server/etc/catalog:ro"

  presto-init:
    image: alpine:latest
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        /bin/sh /init/bootstrap.sh
    depends_on:
      presto:
        condition: service_healthy
    volumes:
      - "./ci/docker/init:/init:ro"
